version: 2
updates:
  # Keeps the commit SHAs that the workflows pin their actions to up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release, so that a compromised or broken
    # release has time to be noticed and pulled.
    cooldown:
      default-days: 14
    # One pull request for all actions instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
