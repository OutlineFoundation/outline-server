name: Build and Test

concurrency:
  # Group by workflow and pull request number. Unlike the head branch name,
  # the number is unique across forks. Runs that are not for a pull request
  # fall back to the run ID, so each gets its own group and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - master
  schedule:
    - cron: "0 13 * * *"  # Run daily at 1PM UTC.

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install NPM Dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Lint
        run: ./task lint

  shadowbox:
    name: Shadowbox
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Shadowbox Debug Build
        run: ./task shadowbox:build

      - name: Shadowbox Unit Test
        run: ./task shadowbox:test

      - name: Shadowbox Integration Test
        run: ./task shadowbox:integration_test

      - name: Verify Open API Spec
        uses: mbowman100/swagger-validator-action@b1f592cf919014c7e1865f0a5e552886aee23e37  # master as of 2026-11-05; no release since 2.0 (2020)
        with:
          files: |
            src/shadowbox/server/api.yml

  shadowbox-arm64:
    name: Shadowbox (arm64)
    runs-on: ubuntu-22.04-arm
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install NPM Dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Shadowbox Debug Build (arm64)
        run: TARGET_ARCH=aarch64 ./task shadowbox:build

      - name: Shadowbox Unit Test
        run: ./task shadowbox:test

      - name: Shadowbox Docker Build (arm64)
        run: TARGET_ARCH=aarch64 ./task shadowbox:docker:build

  manual-install-script:
    name: Manual Install Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Outline Server
        run: ./src/server_manager/install_scripts/install_server.sh --hostname localhost

      - name: Test API
        run: 'curl --silent --fail --insecure "$(grep "apiUrl" /opt/outline/access.txt | cut -d: -f 2-)/server"'

  metrics-server:
    name: Metrics Server
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Metrics Server Debug Build
        run: ./task metrics_server:build

      - name: Metrics Server Test
        run: ./task metrics_server:test
