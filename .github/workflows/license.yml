name: License checks

concurrency:
  # Scope the group to this workflow. Without the workflow name, workflows
  # triggered by the same push share one group and cancel each other.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only supersede runs for pull requests, so that runs on master and the
  # scheduled run always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - master

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: '${{ github.workspace }}/go.mod'

    - name: Check license headers
      run: go run github.com/google/addlicense -check -l apache -c 'The Outline Authors' -ignore "third_party/**" -v .
