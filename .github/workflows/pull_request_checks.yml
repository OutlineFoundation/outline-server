name: Pull Request Checks

concurrency:
  # Group by workflow and pull request number. Unlike the head branch name,
  # the number is unique across forks. Runs that are not for a pull request
  # fall back to the run ID, so each gets its own group and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened

      # This `edited` flag is why we need a separate workflow -
      # specifying edited here causes this job to be re-run whenever someone edits the PR title/description.

      # If we had the debug builds in this file, they would run unnecessarily, costing resources.
      - edited

      - synchronize

# No default permissions; each job below declares what it needs.
permissions: {}

jobs:
  name_check:
    name: Pull Request Name Check
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Check out the code.
      pull-requests: read  # Read the pull request title.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Ensure Commitizen Format
        uses: JulienKode/pull-request-name-linter-action@8dab22a5f84b07c565ba473f505b0bc5406924dc  # v20.5.0

  size_label:
    name: Change Size Label
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Read the changed files.
      pull-requests: write  # Add the size label.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # size-label-action fails to work when coming from a fork:
      # https://github.com/pascalgn/size-label-action/issues/10
      - if: ${{ !github.event.pull_request.head.repo.fork }}
        name: Apply Size Label
        uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff  # v0.5.7
        env:
          IGNORED: |
            LICENSE
            package-lock.json
            third_party/*
        with:
          sizes: >
            {
              "0": "XS",
              "64": "S",
              "128": "M",
              "256": "L",
              "512": "XL",
              "1024": "XXL"
            }
