name: Lint workflows

concurrency:
  # Group by workflow and pull request number. Unlike the head branch name,
  # the number is unique across forks. Runs that are not for a pull request
  # fall back to the run ID, so each gets its own group and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # actionlint v1.7.12 requires Go >= 1.25, which go.mod satisfies.
          go-version-file: go.mod
          cache: false

      # Run with `go run` at a pinned version rather than adding it to
      # tools.go, which would pull its dependency tree into the root module.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          version: 1.32.0
          # `annotations: true` shows findings inline on the diff. It is
          # mutually exclusive with the SARIF upload this action does by
          # default, which would also need `security-events: write`, a
          # permission that pull requests from forks cannot be granted.
          advanced-security: false
          annotations: true
